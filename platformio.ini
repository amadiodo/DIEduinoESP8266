[env:esp01_1m]
platform = espressif8266
board = esp12e
framework = arduino
build_flags = -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps = ayushsharma82/ElegantOTA @ ^4.0.0
